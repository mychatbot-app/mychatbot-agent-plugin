name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check:links
      - name: Validate Claude Code package
        run: npx --yes @anthropic-ai/claude-code@2.1.251 plugin validate ./claude --strict
      - name: Validate Codex marketplace discovery
        run: |
          npx --yes @openai/codex@0.150.1 plugin marketplace add ./ --json
          npx --yes @openai/codex@0.150.1 plugin list --marketplace mychatbot-app --available --json > /tmp/mychatbot-codex-plugins.json
          jq -e '(.installed[]?, .available[]?) | select(.name == "mychatbot")' /tmp/mychatbot-codex-plugins.json
